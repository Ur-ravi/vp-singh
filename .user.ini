; ============================================================
; CodeIgniter 4 PHP settings for Hostinger
; ============================================================
;
; IMPORTANT: Hostinger shared hosting uses PHP-FPM.
; Some directives below are PHP_INI_ALL (work in .user.ini).
; Others are PHP_INI_PERDIR and MUST be set via Hostinger hPanel:
;
;   hPanel → Websites → [Your Site] → PHP Configuration
;   Set these values there:
;     - upload_max_filesize  = 64M
;     - post_max_size        = 64M
;     - max_input_vars       = 3000
;     - display_errors       = Off
;
; Directives below are PHP_INI_ALL and work in .user.ini:

; Increase memory limit
memory_limit = 256M

; Increase max execution time
max_execution_time = 300

; Increase max input time
max_input_time = 300

; Error reporting
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Timezone
date.timezone = Asia/Kolkata

; Session cookie settings (required for CI4 sessions on Hostinger)
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1
